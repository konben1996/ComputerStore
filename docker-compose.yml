services:
  mysql:
    image: mysql:8.0
    container_name: computer_store_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: computer_store
      MYSQL_USER: computer_store
      MYSQL_PASSWORD: computer_store
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro

  web:
    build: .
    container_name: computer_store_web
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3001:3000"
    depends_on:
      - mysql

volumes:
  mysql_data:
